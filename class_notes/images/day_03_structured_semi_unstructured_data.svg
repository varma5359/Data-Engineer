<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700"><rect width="1400" height="700" fill="#f8fafc"/><text x="700" y="75" text-anchor="middle" font-family="Arial" font-size="38" font-weight="bold" fill="#0f172a">Three Common Data Structures</text><g font-family="Arial" text-anchor="middle" fill="#0f172a"><rect x="55" y="145" width="400" height="430" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="255" y="210" font-size="30" font-weight="bold">Structured</text><text x="255" y="255" font-size="22">Fixed rows and columns</text><rect x="105" y="300" width="300" height="150" fill="white" stroke="#64748b" stroke-width="2"/><path d="M205 300 V450 M305 300 V450 M105 350 H405 M105 400 H405" stroke="#64748b" stroke-width="2"/><g font-size="18"><text x="155" y="333">ID</text><text x="255" y="333">Name</text><text x="355" y="333">Qty</text><text x="155" y="383">01</text><text x="255" y="383">Ravi</text><text x="355" y="383">2</text></g><text x="255" y="510" font-size="21">Example: SQL table, CSV</text><rect x="500" y="145" width="400" height="430" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><text x="700" y="210" font-size="30" font-weight="bold">Semi-structured</text><text x="700" y="255" font-size="22">Labels / keys describe values</text><rect x="555" y="295" width="290" height="165" rx="10" fill="white" stroke="#64748b" stroke-width="2"/><g font-family="monospace" font-size="21" text-anchor="start"><text x="580" y="340">{</text><text x="605" y="375">"name": "Ravi",</text><text x="605" y="410">"orders": 2</text><text x="580" y="445">}</text></g><text x="700" y="510" font-size="21">Example: JSON, XML</text><rect x="945" y="145" width="400" height="430" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="4"/><text x="1145" y="210" font-size="30" font-weight="bold">Unstructured</text><text x="1145" y="255" font-size="22">No fixed table structure</text><rect x="1005" y="300" width="280" height="160" rx="12" fill="white" stroke="#64748b" stroke-width="2"/><path d="M1030 425 Q1080 320 1135 390 T1260 350" stroke="#7c3aed" stroke-width="7" fill="none"/><circle cx="1080" cy="360" r="18" fill="#f59e0b"/><text x="1145" y="510" font-size="21">Example: images, audio, video</text></g></svg>