<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#475569"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><text x="700" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#0f172a">Basic File Operations in a Data Pipeline</text><rect x="55" y="185" width="240.4" height="245" rx="22" fill="#dbeafe" stroke="#64748b" stroke-width="3"/><text x="175.2" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#0f172a">Locate</text><text x="175.2" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#334155">Choose folder</text><text x="175.2" y="347" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#334155">and file path</text><path d="M298.4 307.5 H310.4" stroke="#475569" stroke-width="5" fill="none" marker-end="url(#arr)"/><rect x="317.4" y="185" width="240.4" height="245" rx="22" fill="#dcfce7" stroke="#64748b" stroke-width="3"/><text x="437.59999999999997" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#0f172a">Open</text><text x="437.59999999999997" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#334155">Select mode: r / w</text><text x="437.59999999999997" y="347" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#334155">or a</text><path d="M560.8 307.5 H572.8" stroke="#475569" stroke-width="5" fill="none" marker-end="url(#arr)"/><rect x="579.8" y="185" width="240.4" height="245" rx="22" fill="#fef3c7" stroke="#64748b" stroke-width="3"/><text x="700" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#0f172a">Read or write</text><text x="700" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#334155">Load text / records</text><text x="700" y="347" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#334155">or save results</text><path d="M823.1999999999999 307.5 H835.1999999999999" stroke="#475569" stroke-width="5" fill="none" marker-end="url(#arr)"/><rect x="842.1999999999999" y="185" width="240.4" height="245" rx="22" fill="#ede9fe" stroke="#64748b" stroke-width="3"/><text x="962.4" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#0f172a">Close safely</text><text x="962.4" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#334155">Use with open(...)</text><text x="962.4" y="347" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#334155">context manager</text><path d="M1085.6 307.5 H1097.6" stroke="#475569" stroke-width="5" fill="none" marker-end="url(#arr)"/><rect x="1104.6" y="185" width="240.4" height="245" rx="22" fill="#ffe4e6" stroke="#64748b" stroke-width="3"/><text x="1224.8" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#0f172a">Verify</text><text x="1224.8" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#334155">Check file exists</text><text x="1224.8" y="347" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#334155">and content is correct</text><text x="700" y="535" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="600" fill="#334155">Always check the path and choose the correct file mode</text></svg>