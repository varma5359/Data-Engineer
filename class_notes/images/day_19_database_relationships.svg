<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650"><defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#475569"/></marker></defs><rect width="1400" height="650" fill="#f8fafc"/><text x="700" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="37" font-weight="bold" fill="#0f172a">One-to-One, One-to-Many and Many-to-Many</text><rect x="48" y="190" width="244.8" height="230" rx="20" fill="#dbeafe" stroke="#64748b" stroke-width="3"/><text x="170.4" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">One-to-one</text><text x="170.4" y="302" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#334155">One person</text><text x="170.4" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#334155">One profile</text><path d="M294.8 305 H305.8" stroke="#475569" stroke-width="5" marker-end="url(#ar)"/><rect x="312.8" y="190" width="244.8" height="230" rx="20" fill="#dcfce7" stroke="#64748b" stroke-width="3"/><text x="435.20000000000005" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">One-to-many</text><text x="435.20000000000005" y="302" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#334155">One customer</text><text x="435.20000000000005" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#334155">Many orders</text><path d="M559.6 305 H570.6" stroke="#475569" stroke-width="5" marker-end="url(#ar)"/><rect x="577.6" y="190" width="244.8" height="230" rx="20" fill="#fef3c7" stroke="#64748b" stroke-width="3"/><text x="700" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Many-to-many</text><text x="700" y="302" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#334155">Orders and products</text><text x="700" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#334155">Many links both ways</text><path d="M824.4000000000001 305 H835.4000000000001" stroke="#475569" stroke-width="5" marker-end="url(#ar)"/><rect x="842.4000000000001" y="190" width="244.8" height="230" rx="20" fill="#ede9fe" stroke="#64748b" stroke-width="3"/><text x="964.8000000000001" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Bridge table</text><text x="964.8000000000001" y="302" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#334155">order_items</text><text x="964.8000000000001" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#334155">Connects both sides</text><path d="M1089.2 305 H1100.2" stroke="#475569" stroke-width="5" marker-end="url(#ar)"/><rect x="1107.2" y="190" width="244.8" height="230" rx="20" fill="#ffe4e6" stroke="#64748b" stroke-width="3"/><text x="1229.6000000000001" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Design</text><text x="1229.6000000000001" y="302" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#334155">Choose correct keys</text><text x="1229.6000000000001" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#334155">Avoid duplicated facts</text><text x="700" y="520" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="600" fill="#334155">A bridge table commonly represents many-to-many relationships</text></svg>