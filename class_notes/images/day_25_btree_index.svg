<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650"><defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#475569"/></marker></defs><rect width="1400" height="650" fill="#f8fafc"/><text x="700" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="37" font-weight="bold" fill="#0f172a">B-tree Index — Search by Following the Tree</text><rect x="48" y="190" width="311" height="230" rx="20" fill="#dbeafe" stroke="#64748b" stroke-width="3"/><text x="203.5" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Root page</text><text x="203.5" y="302" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#334155">Start at top</text><text x="203.5" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#334155">Choose key range</text><path d="M361 305 H372" stroke="#475569" stroke-width="5" marker-end="url(#ar)"/><rect x="379" y="190" width="311" height="230" rx="20" fill="#dcfce7" stroke="#64748b" stroke-width="3"/><text x="534.5" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Branch page</text><text x="534.5" y="302" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#334155">Narrow search</text><text x="534.5" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#334155">Follow pointer</text><path d="M692 305 H703" stroke="#475569" stroke-width="5" marker-end="url(#ar)"/><rect x="710" y="190" width="311" height="230" rx="20" fill="#fef3c7" stroke="#64748b" stroke-width="3"/><text x="865.5" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Leaf page</text><text x="865.5" y="302" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#334155">Find key entry</text><text