<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700"><rect width="1400" height="700" fill="#f8fafc"/><text x="700" y="75" text-anchor="middle" font-family="Arial" font-size="38" font-weight="bold" fill="#0f172a">CSV and JSON — Two Ways to Store Data</text><rect x="80" y="145" width="570" height="450" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><rect x="750" y="145" width="570" height="450" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><g font-family="Arial" fill="#0f172a" text-anchor="middle"><text x="365" y="215" font-size="34" font-weight="bold">CSV</text><text x="365" y="260" font-size="22">Tabular rows and columns</text><rect x="145" y="305" width="440" height="145" fill="white" stroke="#64748b" stroke-width="2"/><g font-family="monospace" font-size="20" text-anchor="start"><text x="165" y="345">order_id,customer,total</text><text x="165" y="385">101,Ravi,500</text><text x="165" y="425">102,Anu,750</text></g><text x="365" y="510" font-size="22">Good for spreadsheet-like data</text><text x="365" y="550" font-size="20">Simple • compact • flat structure</text><text x="1035" y="215" font-size="34" font-weight="bold">JSON</text><text x="1035" y="260" font-size="22">Key-value and nested data</text><rect x="825" y="295" width="420" height="190" rx="10" fill="white" stroke="#64748b" stroke-width="2"/><g font-family="monospace" font-size="20" text-anchor="start"><text x="855" y="335">{</text><text x="880" y="375">"order_id": 101,</text><text x="880" y="415">"customer": "Ravi",</text><text x="880" y="455">"total": 500</text><text x="855" y="475">}</text></g><text x="1035" y="535" font-size="22">Good for APIs and nested records</text><text x="1035" y="570" font-size="20">Flexible • readable • hierarchical</text></g></svg>