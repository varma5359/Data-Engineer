<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#475569"/></marker></defs><rect width="1400" height="760" fill="#f8fafc"/><text x="700" y="75" text-anchor="middle" font-family="Arial" font-size="38" font-weight="bold" fill="#0f172a">Exception Handling — Safe Program Flow</text><g font-family="Arial" text-anchor="middle" fill="#0f172a"><rect x="500" y="135" width="400" height="100" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="700" y="195" font-size="28" font-weight="bold">Start processing a record</text><path d="M700 235 V290" stroke="#475569" stroke-width="5" marker-end="url(#arr)"/><path d="M700 290 L850 380 L700 470 L550 380 Z" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><text x="700" y="372" font-size="24" font-weight="bold">Did the operation</text><text x="700" y="405" font-size="24" font-weight="bold">succeed?</text><path d="M550 380 H300 V520" stroke="#16a34a" stroke-width="5" fill="none" marker-end="url(#arr)"/><path d="M850 380 H1100 V520" stroke="#dc2626" stroke-width="5" fill="none" marker-end="url(#arr)"/><text x="400" y="355" font-size="22" fill="#15803d">YES</text><text x="1000" y="355" font-size="22" fill="#b91c1c">NO</text><rect x="120" y="520" width="360" height="110" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="300" y="565" font-size="26" font-weight="bold">Continue</text><text x="300" y="603" font-size="21">Use the valid result</text><rect x="920" y="520" width="360" height="110" rx="18" fill="#ffe4e6" stroke="#e11d48" stroke-width="4"/><text x="1100" y="565" font-size="26" font-weight="bold">except</text><text x="1100" y="603" font-size="21">Handle known error / log it</text><path d="M300 630 V680 H700 M1100 630 V680 H700" stroke="#475569" stroke-width="4" fill="none"/><rect x="500" y="680" width="400" height="55" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="700" y="716" font-size="22" font-weight="bold">finally: cleanup when required</text></g></svg>